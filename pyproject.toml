[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation-lab"
version = "0.1.0"
description = "A practical DeepEval harness for chatbot, RAG, and agent evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepeval>=4.1,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evaluation_lab"]

[tool.pytest.ini_options]
addopts = "-m 'not live_eval' --strict-markers -q"
testpaths = ["tests"]
markers = [
  "live_eval: uses an external LLM judge and may incur cost",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["llm_evaluation_lab"]
